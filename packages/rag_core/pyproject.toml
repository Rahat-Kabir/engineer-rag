[project]
name = "rag_core"
version = "0.1.0"
description = "Core RAG library: ingest, retrieval, generation, storage, eval."
authors = [{ name = "Rahat Kabir" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "python-frontmatter>=1.1",
    "tiktoken>=0.8",
    "fastembed>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
