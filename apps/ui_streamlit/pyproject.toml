[project]
name = "ui_streamlit"
version = "0.1.0"
description = "Streamlit chat UI for engineer-rag (dev / debug)."
authors = [{ name = "Rahat Kabir" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.39",
    "rag_core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_streamlit"]
