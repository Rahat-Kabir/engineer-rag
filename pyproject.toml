[project]
name = "engineer-rag"
version = "0.1.0"
description = "Engineering RAG over a curated corpus of technical articles."
authors = [{ name = "Rahat Kabir" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "rag_core",
    "ui_streamlit",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
rag_core = { workspace = true }
ui_streamlit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
